[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pchs"
version = "0.1.0"
description = "Progressive Convex Hull Simplification"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = ["numpy>=1.21"]

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.args = [
  "-DPCHS_INTERACTIVE=OFF",
  "-DPCHS_TESTS=OFF",
  "-DPCHS_PYTHON_BINDINGS=ON",
]
wheel.packages = []
wheel.py-api = "cp312"
build.targets = ["pchs_python_module"]
install.components = ["pchs_python"]

[tool.cibuildwheel]
# Keep the supported Python 3.8 floor; cibuildwheel 4 drops it.
build = "cp{38,39,310,311,312,313,314}-*"
skip = "*-musllinux_*"
test-requires = ["pytest"]
test-command = "python -m pytest {project}/tests/test_python.py"

[tool.cibuildwheel.config-settings]
"cmake.define.PCHS_BACKEND" = "NATIVE"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos.environment]
# nanobind's C++17 aligned allocation requires macOS 10.13 on Intel.
# cibuildwheel raises this to 11.0 automatically for Apple Silicon.
MACOSX_DEPLOYMENT_TARGET = "10.13"
